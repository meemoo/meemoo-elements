<!doctype html>
<html lang="en">
  <head>
    <title>meemoo-elements demo 🎛</title>
    <style>
      body {
        /* System font stack */
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          "Open Sans", "Helvetica Neue", sans-serif;
      }
      .mm-debug--line {
        min-height: 1.6em;
        overflow-wrap: anywhere;
      }
      .mm-debug--tag {
        color: #22663a;
      }
      .mm-debug--event,
      .mm-debug--readonly {
        color: #666;
      }
      #debug input[type="number"] {
        width: 5em;
      }
      #debug input[type="text"] {
        width: 8em;
      }
      #debug input,
      #debug select,
      #debug button {
        font: inherit;
      }
      #debug {
        position: fixed;
        top: 8px;
        right: 64px;
        bottom: 8px;
        border-radius: 8px;
        border: 1px dashed rgba(0, 0, 0, 0.5);
        padding: 8px 12px;
        overflow: auto;
        width: 340px;
        max-width: 50%;
        background: rgba(255, 255, 255, 0.5);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <a href="https://github.com/meemoo/meemoo-elements">About</a>

    <!-- This "meta" mm-debug shows the "hidden" control on the inner mm-debug. 🤗 -->
    <!-- <mm-debug shallow> -->
    <mm-debug mount="#debug">
      <mm-graph>
        <h1>mm-elements demo</h1>
        <button id="start">start camera</button>
        <button id="add">add frame</button>
        <button id="reset">start over</button>
        <h2>mm-webcam</h2>
        <mm-webcam id="cam"></mm-webcam>
        <h2>mm-animation</h2>
        <mm-animation id="anim" fps="6"></mm-animation>
        <mm-wire from="start" out="click" to="cam" in="start"></mm-wire>
        <mm-wire from="add" out="click" to="cam" in="send"></mm-wire>
        <mm-wire from="cam" out="image" to="anim" in="push"></mm-wire>
        <mm-wire from="reset" out="click" to="anim" in="clear"></mm-wire>
      </mm-graph>
    </mm-debug>
    <!-- </mm-debug> -->

    <div id="debug"></div>

    <script type="module" src="./src/mm-graph.js"></script>
    <script type="module" src="./src/mm-debug.js"></script>
  </body>
</html>
